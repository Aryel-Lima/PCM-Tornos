<style>

<body>
<div id="app"></div>
<script>
'use strict';
/* =====================================================================
   PCM Tornos — interface web conectada a API e PostgreSQL.
   Os dados operacionais são carregados e persistidos no servidor.
   ===================================================================== */
const LS_KEY = 'pcm_tornos_db_v1', SESSION_KEY = 'pcm_tornos_session_v1';
const API_BASE = (document.querySelector('meta[name="pcm-api-base"]')?.content || '/api').replace(/\/$/, '');
let cloudToken = sessionStorage.getItem('pcm_cloud_token_v1') || null;
let cloudVersion = null, cloudQueue = Promise.resolve(), cloudConflict = false, cloudInitialized = false;
class AppError extends Error {}
async function apiRequest(path, options = {}, auth = true) {
  const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
  if (auth && cloudToken) headers.Authorization = 'Bearer ' + cloudToken;
  const response = await fetch(API_BASE + path, Object.assign({}, options, { headers }));
  let body = {}; try { body = await response.json(); } catch (_) {}
  if (!response.ok) throw new AppError(body.error || `Falha no servidor (HTTP ${response.status}).`);
  return body;
}

/* ---------- utilitários ---------- */
const E = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const toISODT = d => `${toISO(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const P = s => { if (!s) return null; if (s instanceof Date) return s; const d = new Date(String(s).length === 10 ? s + 'T00:00' : s); return isNaN(d) ? null : d; };
const fD = s => { const d = P(s); return d ? `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}` : '—'; };
const fDT = s => { const d = P(s); return d ? `${fD(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}` : '—'; };
const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const fR = v => v == null || isNaN(v) ? '—' : BRL.format(v);
const fN = (v, d = 1) => v == null || isNaN(v) ? '—' : Number(v).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
const fP = (v, d = 1) => v == null || isNaN(v) ? '—' : fN(v, d) + '%';
const hoursBetween = (a, b) => { a = P(a); b = P(b); return a && b ? (b - a) / 36e5 : null; };
const addDays = (d, n) => { const x = new Date(P(d)); x.setDate(x.getDate() + n); return x; };
const addMonths = (d, n) => { const x = new Date(P(d)); x.setMonth(x.getMonth() + n); return x; };
const startOfDay = d => { const x = new Date(P(d)); x.setHours(0, 0, 0, 0); return x; };
const round = (v, d = 2) => v == null ? null : Math.round(v * 10 ** d) / 10 ** d;
const sum = (a, f = x => x) => a.reduce((s, x) => s + (Number(f(x)) || 0), 0);
const MONTHS = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];

/* SHA-256 em JS puro (protótipo; em produção usar bcrypt/argon2 no servidor) */
const _pr = []; for (let n = 2; _pr.length < 64; n++) if (_pr.every(p => n % p)) _pr.push(n);
const _fr = x => Math.floor((x - Math.floor(x)) * 4294967296) >>> 0;
const _K = _pr.map(p => _fr(Math.cbrt(p))), _H0 = _pr.slice(0, 8).map(p => _fr(Math.sqrt(p)));
const _rotr = (x, n) => (x >>> n) | (x << (32 - n));
function sha256(msg) {
  const b = [...unescape(encodeURIComponent(msg))].map(c => c.charCodeAt(0)), l = b.length * 8;
  b.push(0x80); while (b.length % 64 !== 56) b.push(0);
  for (let i = 7; i >= 0; i--) b.push(i >= 4 ? 0 : (l >>> (i * 8)) & 255);
  let H = _H0.slice();
  for (let o = 0; o < b.length; o += 64) {
    const w = new Array(64);
    for (let i = 0; i < 16; i++) w[i] = (b[o + 4 * i] << 24 | b[o + 4 * i + 1] << 16 | b[o + 4 * i + 2] << 8 | b[o + 4 * i + 3]) >>> 0;
    for (let i = 16; i < 64; i++) {
      const s0 = _rotr(w[i - 15], 7) ^ _rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = _rotr(w[i - 2], 17) ^ _rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
    }
    let [a, bb, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const S1 = _rotr(e, 6) ^ _rotr(e, 11) ^ _rotr(e, 25), ch = (e & f) ^ (~e & g), t1 = (h + S1 + ch + _K[i] + w[i]) >>> 0;
      const S0 = _rotr(a, 2) ^ _rotr(a, 13) ^ _rotr(a, 22), mj = (a & bb) ^ (a & c) ^ (bb & c), t2 = (S0 + mj) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = bb; bb = a; a = (t1 + t2) >>> 0;
    }
    const v = [a, bb, c, d, e, f, g, h]; H = H.map((x, i) => (x + v[i]) >>> 0);
  }
  return H.map(v => v.toString(16).padStart(8, '0')).join('');
}
function hashPw(pw, salt) { let h = sha256(salt + pw); for (let i = 0; i < 1500; i++) h = sha256(h + salt); return h; }
const newSalt = () => Array.from({ length: 4 }, () => Math.floor(Math.random() * 4294967296).toString(16)).join('');

/* ---------- constantes de domínio ---------- */
const ROLES = { admin: 'Administrador', gestor: 'Gestor de manutenção', tecnico: 'Técnico de manutenção', operador: 'Operador' };
const PERMS = {
  admin: ['*'],
  gestor: ['equip.write', 'failure.report', 'failure.write', 'os.view', 'os.write', 'os.update', 'plan.write', 'stock.view', 'stock.write', 'stock.move', 'cost.view', 'cost.write', 'indicator.view', 'indicator.write', 'report.view'],
  tecnico: ['failure.report', 'failure.write', 'os.view', 'os.write', 'os.update', 'stock.view', 'indicator.view'],
  operador: ['failure.report', 'os.view', 'os.write', 'os.update']
};
const CRIT = ['Baixa', 'Média', 'Alta', 'Crítica'];
const CAUSES = ['mecânica', 'elétrica', 'eletrônica', 'hidráulica', 'operacional', 'outra', 'pendente'];
const FSTATUS = ['Aberta', 'Em reparo', 'Reparada', 'Cancelada'];
const OSTATUS = ['Aberta', 'Planejada', 'Em execução', 'Aguardando peças', 'Concluída', 'Encerrada', 'Cancelada'];
const OSTYPES = ['Corretiva', 'Preventiva', 'Preditiva', 'Melhoria'];
const PRIOR = ['Baixa', 'Média', 'Alta', 'Urgente'];
const TRANS = { 'Aberta': ['Planejada', 'Em execução', 'Cancelada'], 'Planejada': ['Aberta', 'Em execução', 'Cancelada'], 'Em execução': ['Aguardando peças', 'Concluída', 'Cancelada'], 'Aguardando peças': ['Em execução', 'Cancelada'], 'Concluída': ['Encerrada', 'Em execução'], 'Encerrada': [], 'Cancelada': [] };
const ITEM_CATS = ['Rolamentos', 'Correias', 'Fusíveis', 'Contatores', 'Relés', 'Motores', 'Sensores', 'Lubrificantes', 'Óleos hidráulicos', 'Fluidos de corte', 'Filtros', 'Parafusos', 'Ferramentas', 'Materiais de limpeza', 'EPIs', 'Outros'];
const COST_CATS = ['Peças e materiais', 'Mão de obra', 'Serviços terceirizados', 'Indisponibilidade', 'Reajuste', 'Outros'];
const DEFAULT_SETTINGS = {
  company: '', goalAvail: 95, goalMtbf: 150, goalMttr: 8, goalCompliance: 90,
  laborRate: 45, downtimeCostPerHour: 0, minFailures: 3, minHours: 100, alertDays: 7
};

/* ---------- banco ---------- */
let db = null;
const nextSeq = (k) => { db.seq[k] = (db.seq[k] || 0) + 1; return db.seq[k]; };
const uid = (k, w = 4) => `${k}${String(nextSeq(k)).padStart(w, '0')}`;
function saveDB() {
  if (!cloudToken || !db) throw new AppError('Sessão do servidor indisponível. Entre novamente antes de salvar.');
  if (cloudConflict) throw new AppError('Há alterações de outro usuário. Atualize a página antes de continuar.');
  const snapshot = JSON.parse(JSON.stringify(db));
  const tokenAtSave = cloudToken;
  cloudQueue = cloudQueue.catch(() => {}).then(async () => {
    if (cloudConflict) return;
    const result = await apiRequest('/state', { method: 'PUT', headers: { 'Authorization': 'Bearer ' + tokenAtSave }, body: JSON.stringify({ version: cloudVersion, data: snapshot }) }, false);
    cloudVersion = result.version;
  }).catch(err => {
    if (/conflito|atualiz/i.test(err.message) || /409/.test(err.message)) cloudConflict = true;
    console.error('Falha ao sincronizar PCM:', err);
    if (typeof toast === 'function') toast('Não foi possível confirmar o salvamento no servidor. ' + err.message + (cloudConflict ? ' Atualize a página para carregar os dados mais recentes.' : ''), 'err');
  });
  return cloudQueue;
}
function createEmptyDB() {
  db = { v: 1, demo: false, seq: {}, users: [], equipment: [], records: [], failures: [], workOrders: [], plans: [], items: [], movements: [], suppliers: [], costs: [], audit: [], settings: { ...DEFAULT_SETTINGS } };
  const salt = newSalt();
  db.users.push({ id: uid('U', 3), name: 'Administrador', username: 'admin', role: 'admin', active: true, salt, hash: hashPw('Admin@12345', salt) });
  return db;
}
function loadDB() {
  try {
    const s = localStorage.getItem(LS_KEY);
    if (s) {
      db = JSON.parse(s);
      // Migra automaticamente instalações antigas que ainda continham dados fictícios.
      if (db.demo === true) { createEmptyDB(); saveDB(); return; }
      migrate(); return;
    }
  } catch (e) { }
  createEmptyDB(); try { saveDB(); } catch (e) { }
}
function migrate() { db.settings = Object.assign({}, DEFAULT_SETTINGS, db.settings || {}); db.audit = db.audit || []; db.demo = false; }
function clearOperationalData() {
  ['equipment', 'records', 'failures', 'workOrders', 'plans', 'items', 'movements', 'suppliers', 'costs'].forEach(k => { db[k] = []; });
  db.audit = [];
  audit('limpeza', 'sistema', '', 'Registros operacionais apagados; usuários e configurações preservados.');
  saveDB();
}
function audit(action, entity, id, detail) {
  const u = cur(); db.audit.unshift({ at: toISODT(new Date()), user: u ? u.username : 'sistema', action, entity, id, detail: detail || '' });
  if (db.audit.length > 600) db.audit.length = 600;
}

/* ---------- autenticação e permissões ---------- */
let _session = null;
const cur = () => _session ? db.users.find(u => u.id === _session && u.active) || null : null;
function login(username, password) {
  const u = db.users.find(x => x.username === String(username).trim().toLowerCase());
  if (!u || !u.active || hashPw(password, u.salt) !== u.hash) throw new AppError('Usuário ou senha inválidos.');
  _session = u.id; try { localStorage.setItem(SESSION_KEY, u.id); } catch (e) { }
  audit('login', 'user', u.id); saveDB(); return u;
}
function restoreSession() { try { const s = localStorage.getItem(SESSION_KEY); if (s && db.users.find(u => u.id === s && u.active)) _session = s; } catch (e) { } }
function logout() { _session = null; cloudToken = null; cloudVersion = null; cloudConflict = false; try { sessionStorage.removeItem('pcm_cloud_token_v1'); sessionStorage.removeItem('pcm_cloud_user_v1'); localStorage.removeItem(SESSION_KEY); } catch (e) { } }
function can(p) { const u = cur(); if (!u) return false; const r = PERMS[u.role] || []; return r.includes('*') || r.includes(p); }
function need(p) { if (!can(p)) throw new AppError('Você não tem permissão para esta ação.'); }

/* ---------- consultas básicas ---------- */
const eq = id => db.equipment.find(e => e.id === id);
const eqName = id => { const e = eq(id); return e ? `${e.code} — ${e.name}` : '—'; };
const item = id => db.items.find(i => i.id === id);
const done = o => o.status === 'Concluída' || o.status === 'Encerrada';
const activeOS = o => !['Concluída', 'Encerrada', 'Cancelada'].includes(o.status);
const userName = id => { const u = db.users.find(x => x.id === id || x.username === id); return u ? u.name : (id || '—'); };

function equipStatus(e) {
  if (db.workOrders.some(o => o.equipId === e.id && (o.status === 'Em execução' || o.status === 'Aguardando peças'))) return 'manutencao';

}

/* estoque ↔ OS: idempotente (consumedQty garante ausência de movimentos duplicados) */
function syncStock(o) {
  const consume = ['Em execução', 'Aguardando peças', 'Concluída', 'Encerrada'].includes(o.status);
  const need_ = {};
  o.items.forEach(l => { const t = consume ? l.qty : 0; const d = t - (l.consumedQty || 0); if (d > 0) need_[l.itemId] = (need_[l.itemId] || 0) + d; });
  for (const [iid, q] of Object.entries(need_)) { const it = item(iid); if (!it || it.qty < q) throw new AppError(`Estoque insuficiente de "${it ? it.name : iid}" (necessário ${q}, disponível ${it ? it.qty : 0}).`); }
  o.items.forEach(l => {
    const t = consume ? l.qty : 0, d = t - (l.consumedQty || 0); if (!d) return;
    rawMove(item(l.itemId), d > 0 ? 'saida' : 'estorno', Math.abs(d), d > 0 ? `Consumo na ${o.number}` : `Estorno da ${o.number}`, { ref: o.number, equipId: o.equipId, unitCost: l.unitCost });
    l.consumedQty = t;
  });
}
function setOSItems(oid, lines) {
  need('os.update'); const o = db.workOrders.find(x => x.id === oid);
  if (['Encerrada', 'Cancelada'].includes(o.status)) throw new AppError('OS encerrada ou cancelada não pode ter materiais alterados.');
  const old = JSON.parse(JSON.stringify(o.items)), keep = new Set(lines.map(l => l.lid));
  lines.forEach(l => { if (!(l.qty > 0)) throw new AppError('Quantidade deve ser maior que zero.'); });
  try {
    old.filter(l => !keep.has(l.lid) && l.consumedQty).forEach(l => rawMove(item(l.itemId), 'estorno', l.consumedQty, `Item removido da ${o.number}`, { ref: o.number, equipId: o.equipId, unitCost: l.unitCost }));
    o.items = lines.map(l => ({ ...l, consumedQty: (old.find(x => x.lid === l.lid) || {}).consumedQty || 0 }));
    syncStock(o);
  } catch (e) { throw e; }
  audit('materiais', 'os', o.number); saveDB();
}
function addOSItem(oid, itemId, qty) {
  const o = db.workOrders.find(x => x.id === oid), it = item(itemId);
  if (!it) throw new AppError('Selecione um item.');
  const lines = o.items.map(l => ({ lid: l.lid, itemId: l.itemId, qty: l.qty, unitCost: l.unitCost }));
  const ex = lines.find(l => l.itemId === itemId); if (ex) ex.qty += qty; else lines.push({ lid: uid('L', 5), itemId, qty, unitCost: it.price || 0 });
  setOSItems(oid, lines);
}
function removeOSItem(oid, lid) { const o = db.workOrders.find(x => x.id === oid); setOSItems(oid, o.items.filter(l => l.lid !== lid).map(l => ({ lid: l.lid, itemId: l.itemId, qty: l.qty, unitCost: l.unitCost }))); }
function deleteOS(oid) {
  need('os.write');
  const index = db.workOrders.findIndex(x => x.id === oid);
  if (index < 0) throw new AppError('Ordem de serviço não encontrada.');
  const o = db.workOrders[index];
  const returns = (o.items || []).filter(l => Number(l.consumedQty) > 0);
  // Valida todos os itens antes de movimentar o estoque para evitar estorno parcial.
  for (const line of returns) { if (!item(line.itemId)) throw new AppError(`Não foi possível excluir a OS: o item ${line.itemId} não existe mais no estoque.`); }
  const stockSnapshot = returns.map(line => ({ it: item(line.itemId), qty: item(line.itemId).qty }));
  const movementLength = db.movements.length, auditLength = db.audit.length;
  try {
    for (const line of returns) rawMove(item(line.itemId), 'estorno', Number(line.consumedQty), `Devolução por exclusão da ${o.number}`, { ref: o.number, equipId: o.equipId, unitCost: line.unitCost });
    db.workOrders.splice(index, 1);
    audit('excluir', 'os', o.number, `OS ${o.number} excluída pelo usuário ${cur() ? cur().username : 'sistema'}; status anterior: ${o.status}; materiais devolvidos: ${returns.reduce((n, l) => n + Number(l.consumedQty || 0), 0)} unidade(s).`);
    saveDB();

}
function setOSStatus(oid, status, note, extra = {}) {
  const o = db.workOrders.find(x => x.id === oid);
  if (status === 'Cancelada' ? !can('os.write') : !can('os.update')) throw new AppError('Você não tem permissão para esta ação.');
  if (!TRANS[o.status].includes(status)) throw new AppError(`Transição inválida: ${o.status} → ${status}.`);
  if (status === 'Cancelada' && !(note || '').trim()) throw new AppError('Informe a justificativa do cancelamento.');
  const snapshot = JSON.stringify(o);
  try {
    if (status === 'Em execução' && !o.actualStart) o.actualStart = toISODT(new Date());
    if (status === 'Concluída') {
      Object.assign(o, extra);
      if (!o.actualStart || !o.actualEnd) throw new AppError('Informe início e fim reais para concluir a OS.');
      if (P(o.actualEnd) < P(o.actualStart)) throw new AppError('O fim real não pode ser anterior ao início real.');
      if (!(o.techHours > 0)) throw new AppError('Informe o tempo de trabalho técnico (horas) para concluir.');
      if (o.techHours > osDuration(o) + 0.01) throw new AppError('O trabalho técnico não pode exceder a duração total da intervenção.');
      if (!o.result) throw new AppError('Informe o resultado da intervenção.');

    }
    if (status === 'Encerrada') {

      ['laborCost', 'thirdCost', 'otherCost'].forEach(k => { if (o[k] != null && !(o[k] >= 0)) throw new AppError('Os custos lançados não podem ser negativos.'); });
      if (o.otherCost > 0 && !(o.otherDesc || '').trim()) throw new AppError('Descreva os outros custos lançados.');
      if (o.laborCost == null) o.laborCost = round((o.techHours || 0) * db.settings.laborRate, 2);
      o.thirdCost = o.thirdCost || 0; o.otherCost = o.otherCost || 0;

}

}

function planDue(p) {

  if (p.status === 'inativo') return { state: 'inativa', hasOS };
  if (p.periodType === 'horas') {
    const base = p.lastHours ?? e.hours ?? 0, nextH = base + p.interval, rem = nextH - (e.hours || 0);
    return { state: rem <= 0 ? 'vencida' : rem <= Math.max(p.interval * .1, 1) ? 'proxima' : 'ok', nextHours: nextH, remaining: rem, hasOS, label: `${fN(nextH, 0)} h (faltam ${fN(rem, 0)} h)` };
  }
  const base = p.lastDone ? P(p.lastDone) : null;
  if (!base) return { state: 'vencida', due: null, hasOS, label: 'Sem execução registrada' };
  const due = p.periodType === 'meses' ? addMonths(base, p.interval) : addDays(base, p.interval);
  const diff = Math.round((startOfDay(due) - today) / 864e5);
  return { state: diff < 0 ? 'vencida' : diff <= db.settings.alertDays ? 'proxima' : 'ok', due, diff, hasOS, label: fD(due) };
}

const mkPeriod = (from, to) => { const f = P(from), t = P(to); if (!f || !t) throw new AppError('Período inválido.'); if (t < f) throw new AppError('A data final não pode ser anterior à inicial.'); return { from: f, to: new Date(t.getTime() + 864e5 - 1) }; };

function compute(ids, per) {

    nFail += fl.length;
    fl.forEach(f => { failIds.push(f.id); if (f.status === 'Reparada') { if (f.repairHours > 0) { nRep++; repH += f.repairHours; } else repMissing++; } else openF++; });

  const lambda = nFail > 0 && operated > 0 ? nFail / operated : null;

  if (operated <= 0) flags.push('Sem horas operadas registradas no período: MTBF, taxa de falhas e confiabilidade não são calculáveis.');
  else if (nFail === 0) flags.push('Nenhuma falha funcional observada no período: o MTBF não é calculável (não é zero) — a confiabilidade observada é favorável, mas o intervalo pode ser curto.');
  if (nFail > 0 && nRep === 0) flags.push('Nenhuma falha reparada com tempo de reparo registrado: MTTR não calculável.');

  if (openF > 0) flags.push(`${openF} falha(s) ainda em aberto no período: o MTTR pode estar subestimado.`);
  if (scheduled <= 0 && operated > 0) flags.push('Sem horas programadas: disponibilidade operacional não calculável.');
  if (availTheo == null && availOp != null) flags.push('Disponibilidade teórica (MTBF/(MTBF+MTTR)) indisponível; exibida a disponibilidade operacional.');

/* ---------- custos consolidados (fonte única para tela, relatório e Excel) ---------- */
function costRows(ids, per) {

    push({ ...base, category: 'Peças e materiais', value: osParts(o) }); push({ ...base, category: 'Mão de obra', value: o.laborCost || 0 }); push({ ...base, category: 'Serviços terceirizados', value: o.thirdCost || 0 }); push({ ...base, category: 'Outros', value: o.otherCost || 0, desc: o.otherDesc });
  });

/* ---------- Pareto, curva da banheira, alertas ---------- */
function pareto(ids, per, groupBy, metric) {

    const k = groupBy === 'equip' ? eqName(f.equipId) : (groupBy === 'cause' ? f.causeClass : (f.component || 'Não informado')) || 'Não informado';
    const v = metric === 'count' ? 1 : metric === 'downtime' ? (f.needsStop && f.stopStart ? hoursBetween(f.stopStart, f.stopEnd || toISODT(new Date())) || 0 : 0) : failureCost(f);

  const conclusion = `No período de ${fD(from)} a ${fD(to)}, ${cond}. ` +
    (c.nFail === 0 ? 'Não foram registradas falhas funcionais; ' : `Foram registradas ${c.nFail} falha(s) funcional(is), com MTBF ${c.mtbf != null ? fN(c.mtbf) + ' h' : 'não calculável'} e MTTR ${c.mttr != null ? fN(c.mttr) + ' h' : 'não calculável'}. `) +
    `Disponibilidade ${c.avail != null ? fP(c.avail) : 'não calculável'}${c.availTheo == null && c.avail != null ? ' (operacional)' : ''}; cumprimento preventivo ${c.comp.pct != null ? fP(c.comp.pct) : 'não calculável'}; custo de manutenção real de ${fR(cs.real)}${cs.est > 0 ? ' (+ ' + fR(cs.est) + ' estimados)' : ''}. ` +
    (c.reliableOK ? '' : 'Ressalva: volume de dados insuficiente para estimativas estatisticamente robustas. ');
  const months = monthly(ids, toISO(per.from), toISO(per.to));
  return { ids, per, from, to, equips: ids.map(eq), c, cp, prevPer, fails, oss, rows, cs, plans, recurring, off, recs, conclusion, months, settings: S,
    responsible: cur() ? cur().name : '', generatedAt: toISODT(new Date()), variation: { mtbf: var_(c.mtbf, cp.mtbf), mttr: var_(c.mttr, cp.mttr), avail: var_(c.avail, cp.avail), fails: var_(c.nFail, cp.nFail) } };
}

/* ---------- testes automatizados dos cálculos (executáveis no navegador e em Node) ---------- */
function runSelfTests() {
  const res = []; const t = (n, ok, info = '') => res.push({ n, ok: !!ok, info });
  const near = (a, b, e = 1e-6) => a != null && Math.abs(a - b) < e;
  t('SHA-256("abc")', sha256('abc') === 'ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad');
  t('R(t)=e^(-λt) com λ=0,001 e t=100', near(reliability(0.001, 100), Math.exp(-0.1)));
  const bk = db, tmp = { seq: {}, users: [], equipment: [{ id: 'T1', code: 'T', name: 'T', docs: [] }], records: [{ id: 'r', equipId: 'T1', start: '2026-01-01', end: '2026-01-31', scheduled: 300, operated: 270 }],
    failures: [], workOrders: [], plans: [], items: [], movements: [], suppliers: [], costs: [], audit: [], settings: { ...DEFAULT_SETTINGS } };
  const mkF = (d, rep, stopS, stopE) => ({ id: 'f' + d, equipId: 'T1', status: 'Reparada', funcional: true, date: d, repairHours: rep, needsStop: !!stopS, stopStart: stopS, stopEnd: stopE });
  tmp.failures = [mkF('2026-01-05T08:00', 4, '2026-01-05T08:00', '2026-01-05T14:00'), mkF('2026-01-15T08:00', 6, '2026-01-15T08:00', '2026-01-15T18:00'), mkF('2026-01-20T08:00', 5, '2026-01-20T10:00', '2026-01-20T16:00'), mkF('2026-01-20T09:00', 2, '2026-01-20T12:00', '2026-01-20T20:00')];
  db = tmp;
  try {
    const c = compute(['T1'], mkPeriod('2026-01-01', '2026-01-31'));
    t('MTBF = horas operadas / falhas (270/4 = 67,5)', near(c.mtbf, 67.5));
    t('MTTR = horas de reparo / falhas reparadas ((4+6+5+2)/4 = 4,25)', near(c.mttr, 4.25));
    t('Disponibilidade = MTBF/(MTBF+MTTR)', near(c.availTheo, 67.5 / (67.5 + 4.25) * 100));
    t('λ = falhas / horas operadas', near(c.lambda, 4 / 270));
    t('Paradas sobrepostas não são somadas (6+10+ união 10:00–20:00 = 10 → 26 h)', near(c.down, 26), 'obtido ' + c.down);
    t('Disponibilidade operacional = (300−26)/300', near(c.availOp, (300 - 26) / 300 * 100));
    t('Prorrata por período parcial (metade de janeiro ≈ metade das horas)', (() => { const x = compute(['T1'], mkPeriod('2026-01-01', '2026-01-15')); return near(x.operated, 270 * 15 / 31, 1e-6); })());
    tmp.failures = []; const z = compute(['T1'], mkPeriod('2026-01-01', '2026-01-31'));
    t('Sem falhas: MTBF não é zero (não calculável)', z.mtbf === null && z.flags.some(f => f.includes('não é calculável')));
    tmp.failures = [mkF('2026-01-05T08:00', null, '2026-01-05T08:00', '2026-01-05T14:00')]; const y = compute(['T1'], mkPeriod('2026-01-01', '2026-01-31'));
    t('Falha reparada sem tempo de reparo não entra no MTTR', y.mttr === null && y.repMissing === 1);
    tmp.workOrders = [{ id: 'o1', number: 'OS-1', equipId: 'T1', type: 'Preventiva', status: 'Concluída', plannedStart: '2026-01-10T08:00', techHours: 1, items: [] }, { id: 'o2', number: 'OS-2', equipId: 'T1', type: 'Preventiva', status: 'Planejada', plannedStart: '2026-01-12T08:00', plannedEnd: '2026-01-12T10:00', items: [] }, { id: 'o3', number: 'OS-3', equipId: 'T1', type: 'Preventiva', status: 'Cancelada', cancelReason: 'x', plannedStart: '2026-01-20T08:00', items: [] }, { id: 'o4', number: 'OS-4', equipId: 'T1', type: 'Preventiva', status: 'Aberta', plannedStart: '2026-01-25T08:00', items: [] }];
    const k = compute(['T1'], mkPeriod('2026-01-01', '2026-01-31'));
    t('Cumprimento preventivo = executadas concluídas / programadas (1/4 = 25%)', near(k.comp.pct, 25) && k.comp.prog === 4 && k.comp.exec === 1);
    tmp.workOrders = [{ id: 'o1', number: 'OS-1', equipId: 'T1', type: 'Corretiva', status: 'Concluída', plannedStart: '2026-01-10T08:00', actualEnd: '2026-01-10T12:00', laborCost: 100, thirdCost: 50, items: [{ qty: 2, unitCost: 10 }] }];
    const cr = costRows(['T1'], mkPeriod('2026-01-01', '2026-01-31'));
    t('Custo da OS = peças + mão de obra + terceiros (170)', near(sum(cr, r => r.value), 170));
    t('OS apenas Concluída: custo é estimado (ainda não lançado)', cr.length > 0 && cr.every(r => r.kind === 'estimado'));
    tmp.workOrders[0].status = 'Encerrada'; tmp.workOrders[0].otherCost = 30; tmp.workOrders[0].closedAt = '2026-01-10T13:00';
    const ce = costRows(['T1'], mkPeriod('2026-01-01', '2026-01-31'));
    t('OS Encerrada: custos lançados como reais, incluindo outros custos (200)', ce.every(r => r.kind === 'real') && near(sum(ce, r => r.value), 200));
    // estoque idempotente
    const it = { id: 'I1', code: 'I', name: 'Item', qty: 10, unit: 'un', price: 5, priceHistory: [] }; tmp.items = [it];
    const o = { id: 'o9', number: 'OS-9', equipId: 'T1', status: 'Em execução', items: [{ lid: 'a', itemId: 'I1', qty: 3, unitCost: 5, consumedQty: 0 }] };
    syncStock(o); syncStock(o);
    t('Estoque: sincronização repetida não duplica baixa (10−3 = 7)', it.qty === 7 && tmp.movements.length === 1);
    o.status = 'Cancelada'; syncStock(o);
    t('Estoque: cancelamento estorna o consumo (volta a 10)', it.qty === 10 && tmp.movements.length === 2);
  } catch (e) { t('Exceção durante os testes', false, e.message); }
  db = bk; return res;
}

<script>
/* =====================================================================
   PCM Tornos — INTERFACE (parte 1): componentes, layout, painel,
   equipamentos, indicadores, falhas
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const UI = { tab: {}, f: {}, eqTab: 'geral' };
const ACT = {};
const COLORS = { pri: '#1f4e79', pri2: '#2b6cb0', acc: '#e8830c', ok: '#2e9e5b', warn: '#e0a800', bad: '#d64545', gray: '#8795a5', teal: '#2a9d8f' };

/* ---------- feedback ---------- */
function toast(msg, kind = 'ok') { const t = document.createElement('div'); t.className = 'toast ' + kind; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), kind === 'err' ? 6000 : 2800); }
function run(fn) { try { const r = fn(); if (r && r.catch) r.catch(handleErr); } catch (e) { handleErr(e); } }
function handleErr(e) { if (e instanceof AppError) toast(e.message, 'err'); else { console.error(e); toast('Erro inesperado: ' + e.message, 'err'); } }
const refresh = () => renderRoute();

/* ---------- modal e formulários ---------- */
function modal(title, body, wide) {
  closeModal(); const d = document.createElement('div'); d.className = 'mback';
  d.innerHTML = `<div class="modal ${wide ? 'wide' : ''}"><div class="mhead"><h3>${E(title)}</h3><button class="x" data-act="closeModal" type="button">×</button></div><div class="mbody">${body}</div></div>`;
  document.body.appendChild(d); return d;
}
function closeModal() { $$('.mback').forEach(x => x.remove()); }
ACT.closeModal = closeModal;
const opts = o => (typeof o === 'function' ? o() : o || []).map(x => typeof x === 'string' ? { v: x, l: x } : x);
const equipOpts = (all) => db.equipment.filter(e => all || !e.archived).map(e => ({ v: e.id, l: `${e.code} — ${e.name}` }));
const userOpts = () => db.users.filter(u => u.active).map(u => ({ v: u.id, l: u.name }));
function fieldHTML(f, v) {
  const val = v[f.n] ?? f.def ?? '', cls = f.full ? 'full' : '';
  let inp;
  switch (f.t) {
    case 'textarea': inp = `<textarea name="${f.n}" rows="${f.rows || 3}">${E(val)}</textarea>`; break;
    case 'select': inp = `<select name="${f.n}" ${f.ro ? 'disabled' : ''}>${f.blank !== false ? '<option value=""></option>' : ''}${opts(f.opts).map(o => `<option value="${E(o.v)}" ${String(o.v) === String(val) ? 'selected' : ''}>${E(o.l)}</option>`).join('')}</select>`; break;
    case 'checkbox': return `<label class="chk ${cls}"><input type="checkbox" name="${f.n}" ${val === true || val === 'true' ? 'checked' : ''}> ${E(f.l)}</label>`;
    case 'checks': return `<div class="full"><span style="font-size:.78rem;color:var(--mut);font-weight:600">${E(f.l)}</span><div class="checks">${opts(f.opts).map(o => `<label><input type="checkbox" data-checks="${f.n}" value="${E(o.v)}"> ${E(o.l)}</label>`).join('')}</div></div>`;
    case 'file': inp = `<input type="file" name="${f.n}" ${f.multiple ? 'multiple' : ''} ${f.accept ? `accept="${f.accept}"` : ''}>`; break;
    default: inp = `<input type="${f.t || 'text'}" name="${f.n}" value="${E(String(val).length > 16 && f.t === 'date' ? String(val).slice(0, 10) : val)}" ${f.step ? `step="${f.step}"` : ''} ${f.min != null ? `min="${f.min}"` : ''} ${f.ro ? 'readonly' : ''} ${f.t === 'password' ? 'autocomplete="new-password"' : ''}>`;
  }
  return `<label class="${cls}"><span>${E(f.l)}${f.req ? ' *' : ''}</span>${inp}${f.hint ? `<small>${E(f.hint)}</small>` : ''}</label>`;
}
const readFile = (file) => new Promise((res, rej) => {
  if (file.size > 450 * 1024) return rej(new AppError(`O arquivo "${file.name}" excede 450 KB (limite do protótipo com armazenamento local).`));
  const r = new FileReader(); r.onload = () => res({ name: file.name, type: file.type, size: file.size, data: r.result }); r.onerror = () => rej(new AppError('Falha ao ler o arquivo.')); r.readAsDataURL(file);
});
async function collect(fields, form) {
  const out = {}, errs = [];
  for (const f of fields) {
    if (f.t === 'checks') { out[f.n] = $$(`[data-checks="${f.n}"]`, form).filter(x => x.checked).map(x => x.value); continue; }
    const el = form.elements[f.n]; if (!el) continue;
    if (f.t === 'checkbox') out[f.n] = el.checked;
    else if (f.t === 'number') out[f.n] = el.value === '' ? null : Number(el.value);
    else if (f.t === 'file') out[f.n] = await Promise.all([...el.files].map(readFile));
    else out[f.n] = el.value.trim();
    if (f.req && (out[f.n] === '' || out[f.n] == null || (Array.isArray(out[f.n]) && !out[f.n].length))) errs.push(`O campo "${f.l}" é obrigatório.`);
  }
  if (errs.length) throw new AppError(errs.join('\n'));
  return out;
}
function ask(title, fields, vals, onSave, o = {}) {
  const m = modal(title, `<form class="fgrid">${fields.map(f => fieldHTML(f, vals || {})).join('')}</form><div class="ferr" hidden></div><div class="mfoot"><button class="btn ghost" data-act="closeModal" type="button">Cancelar</button><button class="btn pri" id="msave" type="button">${o.submit || 'Salvar'}</button></div>`, o.wide !== false);
  const form = $('form', m), err = $('.ferr', m);
  const go = async () => { try { const v = await collect(fields, form); await onSave(v); closeModal(); refresh(); } catch (e) { err.hidden = false; err.textContent = e instanceof AppError ? e.message : 'Erro inesperado: ' + e.message; if (!(e instanceof AppError)) console.error(e); } };
  $('#msave', m).onclick = go; form.onsubmit = ev => { ev.preventDefault(); go(); };
}
function confirmBox(msg, onYes, label = 'Confirmar') {
  const m = modal('Confirmação', `<p style="white-space:pre-line">${E(msg)}</p><div class="mfoot"><button class="btn ghost" data-act="closeModal">Cancelar</button><button class="btn pri" id="myes">${label}</button></div>`);
  $('#myes', m).onclick = () => { try { onYes(); closeModal(); refresh(); } catch (e) { closeModal(); handleErr(e); } };
}

/* ---------- gráficos ---------- */
const CH = {};
function mkChart(id, cfg) {
  const c = document.getElementById(id); if (!c) return;

}
const chartBox = (id, h) => `<div class="chartbox ${h || ''}"><canvas id="${id}"></canvas></div>`;
const PAL = [COLORS.pri2, COLORS.acc, COLORS.ok, COLORS.bad, COLORS.teal, COLORS.warn, COLORS.gray, '#7b5ea7'];

/* ---------- tabelas ---------- */
const TB = {};
function table(id, cfg) {
  const old = TB[id]; TB[id] = Object.assign({ pageSize: 10 }, cfg, { st: old ? old.st : { q: '', sort: null, dir: 1, page: 1, f: {}, d1: '', d2: '' } });
  const t = TB[id];
  const fl = (cfg.filters || []).map(f => `<select data-tf="${id}" data-k="${f.k}"><option value="">${E(f.l)}: todos</option>${opts(f.o).map(o => `<option value="${E(o.v)}" ${t.st.f[f.k] === String(o.v) ? 'selected' : ''}>${E(o.l)}</option>`).join('')}</select>`).join('');
  const dt = cfg.dates ? `<input type="date" data-td="${id}" data-k="d1" value="${t.st.d1}" title="De"><input type="date" data-td="${id}" data-k="d2" value="${t.st.d2}" title="Até">` : '';
  return `<div class="tbl" id="tb-${id}" data-id="${id}"><div class="tbar"><input type="search" placeholder="Pesquisar…" data-tq="${id}" value="${E(t.st.q)}">${fl}${dt}</div><div class="tbody"></div></div>`;
}
function tbRender(id) {
  const el = $(`#tb-${id} .tbody`), t = TB[id]; if (!el || !t) return; const st = t.st;
  let rows = t.rows().slice();
  (t.filters || []).forEach(f => { const v = st.f[f.k]; if (v) rows = rows.filter(r => String(f.get(r)) === v); });
  if (t.dates) { if (st.d1) rows = rows.filter(r => { const d = P(t.dates(r)); return d && d >= P(st.d1); }); if (st.d2) rows = rows.filter(r => { const d = P(t.dates(r)); return d && d <= new Date(P(st.d2).getTime() + 864e5 - 1); }); }
  if (st.q) { const q = st.q.toLowerCase(); rows = rows.filter(r => t.cols.some(c => String(c.v ? c.v(r) : '').toLowerCase().includes(q))); }
  if (st.sort != null) { const c = t.cols[st.sort]; rows.sort((a, b) => { const x = c.v(a), y = c.v(b); if (x == null) return 1; if (y == null) return -1; return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'pt-BR', { numeric: true })) * st.dir; }); }

}

document.addEventListener('input', e => { const id = e.target.dataset.tq; if (id) { TB[id].st.q = e.target.value; TB[id].st.page = 1; tbRender(id); } if (e.target.dataset.td) { const id = e.target.dataset.td; TB[id].st[e.target.dataset.k] = e.target.value; TB[id].st.page = 1; tbRender(id); } });

/* ---------- layout ---------- */
const NAV = [['dashboard', 'Painel', '📊'], ['equipamentos', 'Equipamentos', '🏭'], ['indicadores', 'Indicadores', '📈', 'indicator.view'], ['falhas', 'Defeitos e falhas', '⚠️'], ['os', 'Ordens de serviço', '🧾', 'os.view'], ['qr', 'QR Codes / Acesso rápido', '▦', 'os.view'], ['preventivas', 'Preventivas', '🗓️'], ['estoque', 'Peças e estoque', '📦', 'stock.view'], ['custos', 'Custos', '💰', 'cost.view'], ['analises', 'Análises (Pareto/Banheira)', '🔎', 'indicator.view'], ['relatorios', 'Relatórios', '📄', 'report.view'], ['usuarios', 'Usuários', '👥', 'user.manage'], ['config', 'Configurações', '⚙️', 'settings.write'], ['metodologia', 'Metodologia', '📘']];

function loginScreen() {
  $('#app').innerHTML = `<div class="login"><form class="box" id="lf"><h2 style="color:var(--pri)">🔧 PCM — Tornos Mecânicos</h2><p class="mut">Planejamento e Controle da Manutenção</p><input name="u" placeholder="Usuário" autocomplete="username" autofocus required><input name="p" type="password" placeholder="Senha" autocomplete="current-password" required><button class="btn pri" style="width:100%">Entrar</button><div class="ferr" id="lerr" hidden></div><div class="demo"><b>Acesso corporativo</b><br>Utilize seu usuário individual. As contas e permissões são administradas no sistema. <div id="init-note" style="margin-top:6px"></div></div></form></div>`;
  const initNote = $('#init-note');
  if (!cloudInitialized) initNote.innerHTML = 'O banco de dados ainda não foi inicializado. Exporte um backup JSON do sistema antigo e acesse <a href="/importar_dados.html">Importar dados</a>.';
  $('#lf').onsubmit = async e => {
    e.preventDefault(); const form = e.target, button = $('button', form), x = $('#lerr'); button.disabled = true; button.textContent = 'Conectando…'; x.hidden = true;
    try {
      const result = await apiRequest('/login', { method: 'POST', body: JSON.stringify({ username: form.elements.u.value, password: form.elements.p.value }) }, false);
      cloudToken = result.token; sessionStorage.setItem('pcm_cloud_token_v1', cloudToken); sessionStorage.setItem('pcm_cloud_user_v1', result.user.id);
      db = result.data; cloudVersion = result.version; cloudConflict = false; _session = result.user.id;
      audit('login', 'user', result.user.id); await saveDB();
      const requested = location.hash; location.hash = (!requested || requested === '#' || requested === '#/') ? '#/dashboard' : requested; await boot();
    } catch (err) { x.hidden = false; x.textContent = err.message; }

  };
}
/* ---------- roteador ---------- */
const VIEWS = {};
function renderRoute() {
  if (!cur()) return loginScreen();
  if (!$('#view')) layout();
  const parts = (location.hash.replace(/^#\/?/, '') || 'dashboard').split('/'), name = parts[0], nav = NAV.find(n => n[0] === name || (name === 'os' && n[0] === 'os'));
  const fn = VIEWS[name];
  $$('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === name));
  $('#side').classList.remove('open');
  if (!fn || (nav && nav[3] && !can(nav[3]))) { setView('<div class="card"><h2>Acesso não autorizado</h2><p>Seu perfil não possui permissão para este módulo (a validação é feita também nas operações de dados).</p></div>'); return; }
  try { fn(parts[1]); tbAll(); } catch (e) { console.error(e); setView(`<div class="card"><h2>Erro ao exibir a tela</h2><p>${E(e.message)}</p></div>`); }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => { closeModal(); renderRoute(); });
async function boot() {
  $('#app').innerHTML = '<div class="login"><div class="box">Conectando ao servidor PCM…</div></div>';
  const savedToken = sessionStorage.getItem('pcm_cloud_token_v1'), savedUser = sessionStorage.getItem('pcm_cloud_user_v1');
  if (savedToken && savedUser) {
    cloudToken = savedToken;
    try {
      const result = await apiRequest('/state', { method: 'GET' });
      db = result.data; cloudVersion = result.version; _session = savedUser; cloudConflict = false;
      if (cur()) { layout(); renderRoute(); return; }
    } catch (e) { console.warn('Sessão PCM não restaurada:', e.message); }
    logout();
  }
  cloudToken = null; _session = null; db = null;
  try { const status = await apiRequest('/status', { method: 'GET' }, false); cloudInitialized = !!status.initialized; }
  catch (e) { cloudInitialized = false; }
  $('#app').innerHTML = ''; loginScreen();
}

function eqPrev(e) { return `<div class="row sp"><h3>Plano de manutenção preventiva</h3>${can('plan.write') ? btn('newPlan', '+ Atividade', `data-eq="${e.id}"`, 'btn pri') + btn('planTemplates', 'Modelos editáveis', `data-eq="${e.id}"`) : ''}</div><div class="card">${table('eqp' + e.id, { rows: () => db.plans.filter(p => p.equipId === e.id), cols: planCols(false) })}</div>`; }
function eqPecas(e) {
  const m = {}; db.movements.filter(x => x.equipId === e.id && (x.type === 'saida' || x.type === 'estorno')).forEach(x => { const r = m[x.itemId] = m[x.itemId] || { itemId: x.itemId, qty: 0, cost: 0 }; const s = x.type === 'saida' ? 1 : -1; r.qty += s * x.qty; r.cost += s * x.qty * x.unitCost; });
  const arr = Object.values(m).filter(r => r.qty > 0.0001);
  return `<div class="card"><h3>Consumo de peças e materiais</h3>${arr.length ? `<table><thead><tr><th>Item</th><th class="num">Qtde</th><th class="num">Custo</th></tr></thead><tbody>${arr.map(r => `<tr><td>${E(item(r.itemId).name)}</td><td class="num">${fN(r.qty, 1)} ${E(item(r.itemId).unit)}</td><td class="num">${fR(r.cost)}</td></tr>`).join('')}</tbody><tfoot><tr><th>Total</th><th></th><th class="num">${fR(sum(arr, r => r.cost))}</th></tr></tfoot></table>` : '<div class="empty">Nenhum consumo registrado.</div>'}</div>`;
}
function eqCustos(e) {
  if (!can('cost.view')) return '<div class="card">Sem permissão para consultar custos.</div>';
  const per = mkPeriod('2000-01-01', toISO(new Date())), rows = costRows([e.id], per), cs = costSummary(rows);
  return `<div class="grid g4">${kpi('Custo acumulado real', fR(cs.real), 'manutenção', 'blue')}${kpi('Estimado', fR(cs.est), 'não realizado', 'yellow')}${kpi('Preventiva', fR(cs.prev), '', 'green')}${kpi('Corretiva', fR(cs.corr), '', 'red')}</div><div class="note info">O valor de aquisição (${fR(e.acqValue)}) é investimento e <b>não</b> entra nas despesas de manutenção.</div><div class="card">${table('eqc' + e.id, { rows: () => rows, cols: costCols(), dates: r => r.date })}</div>`;
}
function eqTL(e) {
  const ev = []; if (e.instDate) ev.push({ d: e.instDate, t: 'Instalação do equipamento', c: 'green' }); else if (e.acqDate) ev.push({ d: e.acqDate, t: 'Aquisição do equipamento', c: 'green' });
  db.failures.filter(f => f.equipId === e.id).forEach(f => ev.push({ d: f.date, t: `Falha ${f.number}: ${f.description} (${f.criticality})`, c: f.criticality === 'Crítica' || f.criticality === 'Alta' ? 'red' : 'yellow' }));
  db.workOrders.filter(o => o.equipId === e.id && o.status !== 'Cancelada').forEach(o => ev.push({ d: o.actualEnd || o.plannedStart, t: `${o.number} (${o.type}) — ${o.description} · ${o.status}`, c: done(o) ? 'green' : '' }));
  const evs = ev.sort((a, b) => P(b.d) - P(a.d));
  return `<div class="card"><h3>Linha do tempo</h3><div class="tl">${evs.map(x => `<div class="ev ${x.c}"><b>${fDT(x.d)}</b><br>${E(x.t)}</div>`).join('') || '<div class="empty">Sem eventos.</div>'}</div></div>`;
}
function eqDocs(e) {
  return `<div class="card"><div class="row sp"><h3>Documentação técnica</h3>${can('equip.write') ? btn('addDoc', '+ Anexar documento', `data-id="${e.id}"`, 'btn pri') : ''}</div>${e.docs.length ? `<table><thead><tr><th>Arquivo</th><th>Tamanho</th><th></th></tr></thead><tbody>${e.docs.map((d, i) => `<tr><td>${E(d.name)}</td><td>${fN(d.size / 1024, 0)} KB</td><td class="row"><a class="btn sm" href="${d.data}" download="${E(d.name)}">Baixar</a>${can('equip.write') ? btn('rmDoc', 'Remover', `data-id="${e.id}" data-i="${i}"`) : ''}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">Nenhum documento anexado.</div>'}<p class="note info">Protótipo: anexos ficam no navegador (limite de 450 KB por arquivo).</p></div>`;
}
ACT.addDoc = d => ask('Anexar documento', [{ n: 'f', l: 'Arquivo (manual, ficha técnica, foto…)', t: 'file', req: 1 }], {}, v => v.f.forEach(x => addDoc(d.id, x)));
ACT.rmDoc = d => confirmBox('Remover este documento?', () => removeDoc(d.id, +d.i));
function eqRel(e) { return `<div class="card"><h3>Relatórios</h3><p>Gere o relatório técnico de operação e manutenção deste equipamento (PDF/Excel).</p><a class="btn pri" href="#/relatorios" data-act="goRel" data-id="${e.id}">Abrir gerador de relatórios</a></div>`; }
ACT.goRel = d => { periodDefaults('rel').equip = d.id; location.hash = '#/relatorios'; };

/* =====================================================================
   INDICADORES
   ===================================================================== */
const REC_FIELDS = () => [{ n: 'equipId', l: 'Equipamento', t: 'select', opts: () => equipOpts(), req: 1, blank: false }, { n: 'start', l: 'Data inicial', t: 'date', req: 1 }, { n: 'end', l: 'Data final', t: 'date', req: 1 }, { n: 'scheduled', l: 'Horas programadas (h)', t: 'number', step: '0.1', min: 0, req: 1 }, { n: 'operated', l: 'Horas efetivamente operadas (h)', t: 'number', step: '0.1', min: 0, req: 1, hint: 'Atualiza as horas acumuladas do equipamento.' }, { n: 'notes', l: 'Observações técnicas', t: 'textarea', full: 1 }];
ACT.newRecord = () => ask('Registro de operação', REC_FIELDS(), { equipId: periodDefaults('ind').equip !== 'all' ? periodDefaults('ind').equip : '' }, v => saveRecord(v));
ACT.editRecord = d => ask('Editar registro de operação', REC_FIELDS(), db.records.find(r => r.id === d.id), v => saveRecord({ ...v, id: d.id }));
ACT.delRecord = d => confirmBox('Excluir este registro de operação?', () => deleteRecord(d.id), 'Excluir');
VIEWS.indicadores = () => {
  const f = periodDefaults('ind'), ids = idsOf(f), per = mkPeriod(f.from, f.to), c = compute(ids, per), S = db.settings, ms = monthly(ids, f.from, f.to), lab = ms.map(m => m.label);
  const tt = UI.rt ?? 100;
  const r = c.lambda != null ? reliability(c.lambda, tt) : null;
  const an = [];
  if (c.mtbf != null && c.mtbf < S.goalMtbf && c.mttr != null && c.mttr > S.goalMttr) an.push('MTBF baixo e MTTR elevado: investigar a frequência das falhas e as dificuldades de reparo (diagnóstico, peças, procedimentos).');
  else if (c.mtbf != null && c.mtbf >= S.goalMtbf && c.mttr != null && c.mttr <= S.goalMttr) an.push('MTBF elevado e MTTR baixo: cenário geralmente favorável à confiabilidade e à recuperação.');
  else { if (c.mtbf != null && c.mtbf < S.goalMtbf) an.push('MTBF abaixo da meta: investigar frequência de falhas, desgaste e oportunidades de melhoria.'); if (c.mttr != null && c.mttr > S.goalMttr) an.push('MTTR acima da meta: investigar diagnóstico, disponibilidade de peças e capacitação.'); }
  if (c.avail != null && c.avail < S.goalAvail) an.push('Disponibilidade abaixo da meta: investigar paradas, frequência de falhas e duração dos reparos.');
  if (c.comp.pct != null && c.comp.pct < S.goalCompliance) an.push('Cumprimento preventivo abaixo da meta: avaliar atrasos, recursos disponíveis e prioridades.');
  setView(`<div class="row sp"><h1>Indicadores de desempenho</h1>${can('indicator.write') ? btn('newRecord', '+ Registro de operação', '', 'btn pri') : ''}</div>${filterBar('ind')}${notes(c.flags)}
  <div class="grid g4">${kpi('Disponibilidade', fP(c.avail), c.availTheo != null ? 'teórica: MTBF/(MTBF+MTTR)' : 'operacional', goalColor(c.avail, S.goalAvail))}${kpi('Disponibilidade operacional', fP(c.availOp), `(prog. − paradas)/prog. · paradas ${fN(c.down)} h`, goalColor(c.availOp, S.goalAvail))}${kpi('MTBF', c.mtbf != null ? fN(c.mtbf) + ' h' : 'não calculável', `${fN(c.operated, 0)} h operadas / ${c.nFail} falha(s)`, goalColor(c.mtbf, S.goalMtbf))}${kpi('MTTR', c.mttr != null ? fN(c.mttr) + ' h' : 'não calculável', `${fN(c.repH)} h de reparo / ${c.nRep} reparada(s)`, goalColor(c.mttr, S.goalMttr, true))}
  ${kpi('Cumprimento preventivo', fP(c.comp.pct), `${c.comp.exec} exec. · ${c.comp.pend} pend. · ${c.comp.late} atras. · ${c.comp.canc} canc. de ${c.comp.prog}`, goalColor(c.comp.pct, S.goalCompliance))}${kpi('Taxa de falhas (λ)', c.lambda != null ? fN(c.lambda1000, 2) + ' /1000 h' : 'não calculável', c.lambda != null ? `${fN(c.lambda, 5)} /h · também 1/MTBF` : '', 'blue')}${kpi(`Confiabilidade R(${tt} h)`, r != null ? fP(r * 100) : '—', c.lambda == null ? 'sem taxa de falhas' : c.reliableOK ? 'estimativa (λ constante)' : 'dados insuficientes — indicativo', r != null && c.reliableOK ? 'blue' : 'yellow')}${kpi('Horas de manutenção preventiva', fN(c.prevH) + ' h', 'trabalho técnico em OS preventivas', 'blue')}</div>
  <div class="note info"><b>Metodologia.</b> <span class="formula">Disp = MTBF/(MTBF+MTTR)×100</span> · <span class="formula">MTBF = horas operadas / nº de falhas</span> · <span class="formula">MTTR = horas de reparo / falhas reparadas</span> · <span class="formula">λ = falhas / horas operadas</span> · <span class="formula">R(t) = e^(−λt)</span>. A disponibilidade operacional usa as horas programadas e as paradas efetivas (sem somar sobreposições) e pode diferir da teórica. R(t) pressupõe taxa de falhas constante. Veja a aba “Metodologia”.</div>
  <div class="grid g2"><div class="card"><h3>Disponibilidade: histórico e meta</h3>${chartBox('i1')}</div><div class="card"><h3>MTBF e MTTR por mês (h)</h3>${chartBox('i2')}</div><div class="card"><h3>Cumprimento preventivo (%)</h3>${chartBox('i3')}</div>
  <div class="card"><h3>Confiabilidade estimada R(t)</h3><div class="row noprint"><label>Intervalo t (h) <input type="number" id="rt" value="${tt}" min="1" style="width:100px"></label><button class="btn" data-act="setRt">Calcular</button></div>${c.lambda != null ? chartBox('i4', 's') : '<div class="empty">λ não calculável no período.</div>'}${c.lambda != null && !c.reliableOK ? '<div class="note">Dados insuficientes: não trate como estimativa confiável.</div>' : ''}</div></div>
  <div class="card"><h3>Análise conjunta (sugestões de investigação)</h3>${an.length ? '<ul>' + an.map(x => `<li>${E(x)}</li>`).join('') + '</ul><p class="mut">Sugestões baseadas nos registros; não representam causas confirmadas.</p>' : '<p class="mut">Sem desvios identificados com os dados do período.</p>'}${c.comp.reasons.length ? `<h3>Preventivas não realizadas — motivos</h3><ul>${c.comp.reasons.map(x => `<li>${E(x.os)} · ${E(x.equip)}: ${E(x.reason)}</li>`).join('')}</ul>` : ''}</div>
  <div class="card"><h3>Registros de operação</h3>${table('rec', { rows: () => db.records.filter(x => ids.includes(x.equipId)), dates: x => x.start, cols: [{ l: 'Equipamento', v: x => eqName(x.equipId) }, { l: 'Período', v: x => x.start, r: x => `${fD(x.start)} – ${fD(x.end)}` }, { l: 'Programadas', num: 1, v: x => x.scheduled, r: x => fN(x.scheduled) + ' h' }, { l: 'Operadas', num: 1, v: x => x.operated, r: x => fN(x.operated) + ' h' }, { l: 'Observações', v: x => x.notes || '' }, { l: '', r: x => can('indicator.write') ? `<div class="row">${btn('editRecord', 'Editar', `data-id="${x.id}"`)}${btn('delRecord', 'Excluir', `data-id="${x.id}"`, 'btn sm bad')}</div>` : '' }] })}</div>`);
  mkChart('i1', { type: 'line', data: { labels: lab, datasets: [{ label: 'Disponibilidade (%)', data: ms.map(m => round(m.c.avail)), borderColor: COLORS.pri2, spanGaps: true }, { label: 'Meta', data: lab.map(() => S.goalAvail), borderColor: COLORS.bad, borderDash: [6, 4], pointRadius: 0 }] }, options: { scales: { y: { suggestedMin: 80, suggestedMax: 100 } } } });
  mkChart('i2', { type: 'line', data: { labels: lab, datasets: [{ label: 'MTBF (h)', data: ms.map(m => round(m.c.mtbf)), borderColor: COLORS.ok, spanGaps: true, yAxisID: 'y' }, { label: 'MTTR (h)', data: ms.map(m => round(m.c.mttr)), borderColor: COLORS.bad, spanGaps: true, yAxisID: 'y1' }] }, options: { scales: { y: { position: 'left', title: { display: true, text: 'MTBF (h)' } }, y1: { position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: 'MTTR (h)' } } } } });
  mkChart('i3', { type: 'bar', data: { labels: lab, datasets: [{ label: 'Cumprimento (%)', data: ms.map(m => round(m.c.comp.pct)), backgroundColor: COLORS.teal }, { type: 'line', label: 'Meta', data: lab.map(() => S.goalCompliance), borderColor: COLORS.bad, borderDash: [6, 4], pointRadius: 0 }] }, options: { scales: { y: { beginAtZero: true, max: 100 } } } });
  if (c.lambda != null) { const mx = Math.max(tt * 2, 100), xs = Array.from({ length: 21 }, (_, i) => Math.round(mx * i / 20)); mkChart('i4', { type: 'line', data: { labels: xs, datasets: [{ label: 'R(t) %', data: xs.map(x => round(reliability(c.lambda, x) * 100)), borderColor: COLORS.pri2, pointRadius: 0 }] }, options: { scales: { x: { title: { display: true, text: 't (h)' } }, y: { min: 0, max: 100 } }, plugins: { legend: { display: false } } } }); }
};
ACT.setRt = () => { const v = +$('#rt').value; if (!(v > 0)) throw new AppError('Informe um intervalo positivo em horas.'); UI.rt = v; refresh(); };

/* =====================================================================
   FALHAS
   ===================================================================== */
function failureFields(isNew) {
  const op = cur().role === 'operador', full = can('failure.write');
  const base = [{ n: 'equipId', l: 'Equipamento', t: 'select', opts: () => equipOpts(), req: 1, blank: false }, { n: 'date', l: 'Data e hora da ocorrência', t: 'datetime-local', req: 1 }, { n: 'description', l: 'Descrição do defeito', t: 'textarea', req: 1, full: 1 }, { n: 'component', l: 'Componente afetado' }, { n: 'symptoms', l: 'Sintomas' }, { n: 'criticality', l: 'Grau de criticidade', t: 'select', opts: CRIT, req: 1, blank: false }, { n: 'impact', l: 'Impacto na produção' }, { n: 'needsStop', l: 'Necessidade de parada', t: 'checkbox' }, { n: 'funcional', l: 'Falha funcional (conta para MTBF/MTTR)', t: 'checkbox', def: true }, { n: 'stopStart', l: 'Data/hora da parada', t: 'datetime-local' }];
  if (op || (isNew && !full)) return [...base, { n: 'attachments', l: 'Fotografias / documentos', t: 'file', multiple: true, full: 1 }];
  return [...base, { n: 'stopEnd', l: 'Data/hora da liberação', t: 'datetime-local' }, { n: 'causeClass', l: 'Classificação da causa', t: 'select', opts: CAUSES, blank: false, hint: '“pendente” = ainda não diagnosticada' }, { n: 'cause', l: 'Causa identificada' }, { n: 'repairHours', l: 'Tempo de reparo — trabalho técnico (h)', t: 'number', step: '0.1', min: 0, hint: 'Diferente do tempo de indisponibilidade.' }, { n: 'solution', l: 'Solução aplicada', t: 'textarea', full: 1 }, { n: 'estCost', l: 'Custo estimado (R$)', t: 'number', step: '0.01', min: 0 }, { n: 'realCost', l: 'Custo efetivo (R$)', t: 'number', step: '0.01', min: 0, hint: 'Contabilizado só se não houver OS vinculada (evita duplicidade).' }, { n: 'status', l: 'Situação', t: 'select', opts: FSTATUS, blank: false }, { n: 'attachments', l: 'Adicionar fotografias / documentos', t: 'file', multiple: true, full: 1 }];
}
ACT.newFailure = d => ask('Registrar defeito / falha', failureFields(true), { equipId: d.eq || '', date: toISODT(new Date()), criticality: 'Média', causeClass: 'pendente', status: 'Aberta', funcional: true }, v => { const a = v.attachments || []; delete v.attachments; const id = saveFailure(v); const f = db.failures.find(x => x.id === id); f.attachments = a; saveDB(); toast('Defeito registrado.'); });
ACT.editFailure = d => ask('Editar falha ' + db.failures.find(f => f.id === d.id).number, failureFields(false), db.failures.find(f => f.id === d.id), v => { const a = v.attachments || []; delete v.attachments; saveFailure({ ...v, id: d.id }); const f = db.failures.find(x => x.id === d.id); f.attachments = (f.attachments || []).concat(a); saveDB(); });
ACT.failureToOS = d => { const id = osFromFailure(d.id); closeModal(); toast('OS criada.'); location.hash = '#/os/' + id; };
ACT.viewFailure = d => {
  const f = db.failures.find(x => x.id === d.id), os = db.workOrders.filter(o => o.failureId === f.id), rec = failureRecurrence(f), hist = db.failures.filter(x => x.equipId === f.equipId && x.component && x.component === f.component && x.id !== f.id);
  const kv = [['Equipamento', eqName(f.equipId)], ['Data/hora', fDT(f.date)], ['Registrado por', userName(f.reporter)], ['Componente', f.component || '—'], ['Sintomas', f.symptoms || '—'], ['Causa', `${f.causeClass}${f.cause ? ' — ' + f.cause : ''}`], ['Criticidade', f.criticality], ['Impacto', f.impact || '—'], ['Parada', f.needsStop ? `${fDT(f.stopStart)} → ${f.stopEnd ? fDT(f.stopEnd) : 'em andamento'}` : 'Não'], ['Indisponibilidade', f.downtime != null ? fN(f.downtime) + ' h' : '—'], ['Tempo de reparo', f.repairHours != null ? fN(f.repairHours) + ' h' : '—'], ['Solução', f.solution || '—'], ['Custo est. / efetivo', `${fR(f.estCost)} / ${fR(f.realCost)}`], ['Falha funcional', f.funcional !== false ? 'Sim' : 'Não']];
  const m = modal(`Falha ${f.number} ${''}`, `<div class="row">${fBadge(f.status)} ${critBadge(f.criticality)} ${rec ? badge('Reincidente ×' + (rec + 1), 'orange') : ''}</div><dl class="kv" style="margin-top:10px">${kv.map(([k, v]) => `<dt>${k}</dt><dd>${E(v)}</dd>`).join('')}</dl>${os.length ? `<h4 style="margin-top:12px">OS vinculadas</h4>${os.map(o => `<div><a href="#/os/${o.id}">${E(o.number)}</a> ${osBadge(o.status)}</div>`).join('')}` : ''}${hist.length ? `<h4 style="margin-top:12px">Histórico de reincidência (mesmo componente)</h4>${hist.map(h => `<div>${E(h.number)} · ${fD(h.date)} · ${E(h.description)}</div>`).join('')}` : ''}${(f.attachments || []).length ? `<h4 style="margin-top:12px">Anexos</h4>${f.attachments.map(a => `<div><a href="${a.data}" download="${E(a.name)}">${E(a.name)}</a></div>`).join('')}` : ''}<div class="mfoot">${can('failure.write') ? btn('editFailure', 'Editar', `data-id="${f.id}"`, 'btn') : ''}${can('os.write') && f.status !== 'Cancelada' && !os.some(o => o.status !== 'Cancelada') ? btn('failureToOS', 'Gerar ordem de serviço', `data-id="${f.id}"`, 'btn pri') : ''}</div>`, true);
};
VIEWS.falhas = () => {
  setView(`<div class="row sp"><h1>Defeitos e falhas</h1>${can('failure.report') ? btn('newFailure', '+ Registrar defeito', '', 'btn pri') : ''}</div><div class="card">${table('fl', {
    rows: () => db.failures, dates: f => f.date, cols: failCols(true), empty: 'Nenhuma falha registrada.',
    filters: [{ k: 'e', l: 'Equipamento', o: () => equipOpts(true), get: f => f.equipId }, { k: 'c', l: 'Criticidade', o: CRIT, get: f => f.criticality }, { k: 'k', l: 'Causa', o: CAUSES, get: f => f.causeClass }, { k: 's', l: 'Situação', o: FSTATUS, get: f => f.status }, { k: 'r', l: 'Responsável', o: () => userOpts(), get: f => f.reporter }, { k: 'm', l: 'Componente', o: () => [...new Set(db.failures.map(f => f.component).filter(Boolean))], get: f => f.component || '' }]
  })}</div>`);
};

</script>
<script>
/* =====================================================================
   PCM Tornos — INTERFACE (parte 2): OS, preventivas, estoque, custos,
   análises, relatórios (PDF/Excel), usuários, configurações, metodologia
   ===================================================================== */

/* ---------- colunas reutilizadas ---------- */
function osCols(showEq) {
  return [{ l: 'OS', v: o => o.number, r: o => `<a href="#/os/${o.id}"><b>${E(o.number)}</b></a>` }, ...(showEq ? [{ l: 'Equipamento', v: o => eqName(o.equipId), r: o => E(eq(o.equipId).code) }] : []), { l: 'Tipo', v: o => o.type }, { l: 'Descrição', v: o => o.description }, { l: 'Prioridade', v: o => PRIOR.indexOf(o.priority), r: o => badge(o.priority, { Baixa: 'green', Média: 'yellow', Alta: 'orange', Urgente: 'red' }[o.priority] || 'gray') }, { l: 'Planejada', v: o => o.plannedStart, r: o => fDT(o.plannedStart) }, { l: 'Status', v: o => o.status, r: o => osBadge(o.status) }, ...(can('cost.view') ? [{ l: 'Custo', num: 1, v: o => osCost(o), r: o => fR(osCost(o)) }] : [])];
}
function planCols(showEq) {
  return [{ l: 'Atividade', v: p => p.name, r: p => `<b>${E(p.name)}</b>${p.example ? ' <small class="mut">(modelo)</small>' : ''}<br><small>${E(p.component || '')}</small>` }, ...(showEq ? [{ l: 'Equipamento', v: p => eqName(p.equipId), r: p => E(eq(p.equipId).code) }] : []), { l: 'Periodicidade', v: p => p.interval, r: p => `${p.interval} ${p.periodType}` }, { l: 'Última execução', v: p => p.lastDone || '', r: p => p.periodType === 'horas' ? (p.lastHours != null ? fN(p.lastHours, 0) + ' h' : '—') : fD(p.lastDone) }, { l: 'Próxima', v: p => { const d = planDue(p); return d.due ? d.due.getTime() : d.nextHours || 0; }, r: p => E(planDue(p).label || '—') }, { l: 'Situação', v: p => planDue(p).state, r: p => planBadge(planDue(p)) + (planDue(p).hasOS ? ' <span class="badge blue">OS aberta</span>' : '') },

/* =====================================================================
   QR CODES — criação de OS por equipamento e acesso rápido à OS
   ===================================================================== */
const QR_BASE_KEY = 'pcm_tornos_qr_base_url_v1';
function getQRBaseUrl() {
  const saved = (localStorage.getItem(QR_BASE_KEY) || '').trim();
  if (saved) return saved.replace(/#.*$/, '').replace(/\/$/, '');
  const current = location.href.split('#')[0];
  const localHost = location.protocol === 'file:' || ['localhost', '127.0.0.1', '::1'].includes(location.hostname);
  if (!localHost) return current.replace(/#.*$/, '').replace(/\/$/, '');
  const entered = prompt('O PCM está aberto localmente e esse endereço não funciona ao escanear o QR em outro aparelho. Cole a URL completa do sistema, hospedada ou acessível pela rede Wi-Fi (ex.: http://192.168.1.20:8000/PCM_Tornos.html). Não use file:// nem localhost.');
  if (!entered) throw new AppError('Geração do QR Code cancelada. Configure uma URL acessível pelo celular.');
  let url;
  try { url = new URL(entered.trim()); } catch (_) { throw new AppError('URL inválida. Informe o endereço completo começando com http:// ou https://.'); }
  if (!['http:', 'https:'].includes(url.protocol) || ['localhost', '127.0.0.1', '::1'].includes(url.hostname)) throw new AppError('Use uma URL http:// ou https:// acessível pelo celular. Não use file:// ou localhost.');
  url.hash = '';
  localStorage.setItem(QR_BASE_KEY, url.href.replace(/\/$/, ''));
  return url.href.replace(/\/$/, '');
}
function qrTarget(kind, id) {
  const base = getQRBaseUrl();
  return base + '#/' + (kind === 'eq' ? 'qr-eq/' : 'qr-os/') + encodeURIComponent(id);
}
ACT.configureQRBase = () => {
  const current = localStorage.getItem(QR_BASE_KEY) || (location.protocol === 'http:' || location.protocol === 'https:' ? location.href.split('#')[0] : '');
  const entered = prompt('Informe a URL completa do arquivo PCM que o celular consegue abrir. Ex.: https://seusistema.com/PCM_Tornos.html ou http://192.168.1.20:8000/PCM_Tornos.html. Deixe vazio para remover a configuração.', current);
  if (entered === null) return;
  if (!entered.trim()) { localStorage.removeItem(QR_BASE_KEY); toast('URL personalizada removida.'); refresh(); return; }
  let url;
  try { url = new URL(entered.trim()); } catch (_) { return toast('URL inválida. Informe o endereço completo com http:// ou https://.', 'err'); }
  if (!['http:', 'https:'].includes(url.protocol) || ['localhost', '127.0.0.1', '::1'].includes(url.hostname)) return toast('Use um endereço http:// ou https:// acessível pelo celular, sem localhost.', 'err');
  url.hash = '';
  localStorage.setItem(QR_BASE_KEY, url.href.replace(/\/$/, ''));
  toast('Endereço para QR Code salvo.');
  refresh();
};
function showQR(title, payload, hint) {
  const m = modal(title, `<p>${E(hint || 'Escaneie o código para abrir esta tela no sistema PCM.')}</p><div id="pcm-qrcode" style="display:flex;justify-content:center;padding:18px;background:#fff;min-height:220px"></div><p class="mut" style="text-align:center;word-break:break-all;font-size:.8rem">${E(payload)}</p><div class="mfoot"><button class="btn" data-act="printQR" type="button">Imprimir</button><button class="btn pri" data-act="closeModal" type="button">Fechar</button></div>`, false);
  const target = m.querySelector('#pcm-qrcode');
  if (typeof QRCode === 'undefined') { target.innerHTML = '<p class="note bad">Não foi possível carregar o gerador de QR Code. Verifique a conexão com a internet e tente novamente.</p>'; return; }
  new QRCode(target, { text: payload, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M });
}

ACT.printQR = () => { const node = document.querySelector('#pcm-qrcode'); if (!node) return; const img = node.querySelector('img'), canvas = node.querySelector('canvas'); const src = img?.src || (canvas ? canvas.toDataURL('image/png') : ''); if (!src) return toast('QR Code ainda não foi gerado.', 'err'); const w = window.open('', '_blank'); if (!w) return toast('Permita pop-ups para imprimir o QR Code.', 'err'); w.document.write(`<html><head><title>QR Code PCM</title><style>body{font-family:Arial;text-align:center;padding:30px}img{width:260px;height:260px}h2{margin-bottom:8px}</style></head><body><h2>PCM — QR Code</h2><img src="${src}"><script>window.onload=()=>window.print()<\/script></body></html>`); w.document.close(); };

VIEWS.usuarios = () => setView(`<div class="row sp"><h1>Usuários e permissões</h1>${btn('newUser', '+ Novo usuário', '', 'btn pri')}</div><div class="card">${table('us', { rows: () => db.users, cols: [{ l: 'Nome', v: u => u.name }, { l: 'Usuário', v: u => u.username }, { l: 'Perfil', v: u => ROLES[u.role] }, { l: 'Situação', v: u => u.active, r: u => badge(u.active ? 'Ativo' : 'Inativo', u.active ? 'green' : 'gray') }, { l: '', r: u => btn('editUser', 'Editar', `data-id="${u.id}"`) }] })}</div>
<div class="card"><h3>Matriz de perfis</h3><table><thead><tr><th>Perfil</th><th>Capacidades</th></tr></thead><tbody><tr><td>Administrador</td><td>Tudo: usuários, equipamentos, configurações, produtos e fornecedores.</td></tr><tr><td>Gestor de manutenção</td><td>Planeja atividades, gerencia OS, acompanha indicadores, custos e relatórios; cadastra equipamentos e estoque.</td></tr><tr><td>Técnico de manutenção</td><td>Registra/atualiza falhas e intervenções, atualiza OS, informa peças e tempos; consulta indicadores.</td></tr><tr><td>Operador</td><td>Consulta equipamentos, estado e atividades programadas; registra defeitos observados.</td></tr></tbody></table><div class="note">Protótipo sem servidor: as permissões são verificadas nas funções de dados (não apenas ocultando botões), mas, como tudo roda no navegador, não substituem a proteção de um backend real.</div></div>`);
const SET_FIELDS = () => [{ n: 'company', l: 'Empresa / instituição', full: 1 }, { n: 'goalAvail', l: 'Meta de disponibilidade (%)', t: 'number', step: '0.1' }, { n: 'goalMtbf', l: 'Meta de MTBF (h)', t: 'number' }, { n: 'goalMttr', l: 'Meta de MTTR (h)', t: 'number' }, { n: 'goalCompliance', l: 'Meta de cumprimento preventivo (%)', t: 'number' }, { n: 'laborRate', l: 'Custo da mão de obra (R$/h)', t: 'number', step: '0.01' }, { n: 'downtimeCostPerHour', l: 'Custo de indisponibilidade (R$/h)', t: 'number', step: '0.01', hint: '0 = não considerar. Defina somente se houver metodologia.' }, { n: 'minFailures', l: 'Mín. de falhas p/ estimativas confiáveis', t: 'number' }, { n: 'minHours', l: 'Mín. de horas operadas p/ estimativas', t: 'number' }, { n: 'alertDays', l: 'Dias de antecedência p/ alerta preventivo', t: 'number' }];
ACT.editSettings = () => ask('Configurações', SET_FIELDS(), db.settings, v => { Object.keys(v).forEach(k => { if (k !== 'company' && (v[k] == null || v[k] < 0)) throw new AppError('Valores numéricos inválidos.'); }); saveSettings(v); });
ACT.backup = () => { const b = new Blob([JSON.stringify(db)], { type: 'application/json' }), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `backup_pcm_${toISO(new Date())}.json`; a.click(); toast('Backup exportado.'); };
ACT.restoreFile = () => { const i = document.createElement('input'); i.type = 'file'; i.accept = '.json'; i.onchange = () => { const r = new FileReader(); r.onload = () => run(() => { const o = JSON.parse(r.result); if (!o.users || !o.equipment) throw new AppError('Arquivo de backup inválido.'); confirmBox('Substituir os dados atuais pelo backup? Faça isso somente se tiver certeza. Usuários e senhas existentes são gerenciados no servidor; novos usuários devem ser criados pela tela Usuários.', () => { db = o; migrate(); saveDB(); toast('Restauração enviada ao servidor. Confira a mensagem de sincronização.'); }, 'Restaurar'); }); r.readAsText(i.files[0]); }; i.click(); };
ACT.resetData = () => confirmBox('Esta ação apagará todos os equipamentos, registros de operação, falhas, ordens de serviço, preventivas, itens, movimentações, fornecedores e custos. Usuários e configurações serão mantidos. Esta ação não pode ser desfeita. Faça um backup antes de continuar. Deseja prosseguir?', () => { clearOperationalData(); toast('Registros operacionais apagados. Usuários e configurações preservados.'); location.hash = '#/dashboard'; boot(); }, 'Limpar dados operacionais');
ACT.selfTest = () => { const r = runSelfTests(); modal('Testes automatizados dos cálculos', `<p><b>${r.filter(x => x.ok).length}/${r.length}</b> testes aprovados.</p>${r.map(x => `<div>${x.ok ? '✅' : '❌'} ${E(x.n)} ${x.info ? `<small class="mut">${E(x.info)}</small>` : ''}</div>`).join('')}`, true); };
VIEWS.config = () => { const S = db.settings; setView(`<h1>Configurações</h1><div class="grid g2"><div class="card"><div class="row sp"><h3>Parâmetros e metas</h3>${btn('editSettings', 'Editar', '', 'btn pri')}</div><dl class="kv"><dt>Instituição</dt><dd>${E(S.company)}</dd><dt>Meta disponibilidade</dt><dd>${fN(S.goalAvail)}%</dd><dt>Meta MTBF</dt><dd>${fN(S.goalMtbf, 0)} h</dd><dt>Meta MTTR</dt><dd>${fN(S.goalMttr, 0)} h</dd><dt>Meta cumprimento</dt><dd>${fN(S.goalCompliance, 0)}%</dd><dt>Mão de obra</dt><dd>${fR(S.laborRate)}/h</dd><dt>Indisponibilidade</dt><dd>${S.downtimeCostPerHour ? fR(S.downtimeCostPerHour) + '/h' : 'não considerada'}</dd><dt>Mín. p/ confiabilidade</dt><dd>${S.minFailures} falhas · ${S.minHours} h</dd><dt>Alerta preventivo</dt><dd>${S.alertDays} dias</dd></dl></div>
<div class="card"><h3>Gerenciamento de dados e backup</h3><p>Os dados operacionais são armazenados no <b>servidor central PostgreSQL</b> e compartilhados entre usuários autorizados. Exporte backups periodicamente. As credenciais e senhas dos usuários são gerenciadas pelo servidor e não são incluídas no arquivo de backup.</p><div class="row">${btn('backup', '⬇ Exportar backup (JSON)', '', 'btn pri')}${btn('restoreFile', '⬆ Restaurar backup', '', 'btn')}${btn('resetData', '🗑 Limpar dados operacionais', '', 'btn bad')}${btn('selfTest', 'Executar testes dos cálculos', '', 'btn')}</div><p class="note info">“Limpar dados operacionais” apaga equipamentos, operação, falhas, ordens de serviço, preventivas, estoque, fornecedores, custos e auditoria. Os usuários e as configurações são mantidos. A limpeza é irreversível; exporte o backup antes.</p><p class="note info">Modo conectado: as alterações são sincronizadas com o servidor. Se aparecer um erro de sincronização ou conflito, pare de editar e atualize a página antes de continuar. A disponibilidade depende do servidor e da conexão.</p></div></div>
<div class="card"><h3>Registro de alterações (auditoria)</h3>${table('au', { rows: () => db.audit, dates: a => a.at, cols: [{ l: 'Quando', v: a => a.at, r: a => fDT(a.at) }, { l: 'Usuário', v: a => a.user }, { l: 'Ação', v: a => a.action }, { l: 'Entidade', v: a => a.entity }, { l: 'Referência', v: a => a.id }, { l: 'Detalhe', v: a => a.detail }] })}</div>`); };
const METH = [
  ['Definições operacionais', ['Falha funcional: ocorrência registrada que impede ou degrada a função do torno (marcada como “falha funcional”). Defeitos cosméticos/sem impacto podem ser registrados sem contar nos indicadores.', 'Tempo de operação: horas efetivamente operadas informadas nos registros de operação (proporcionais ao período filtrado).', 'Tempo de parada (indisponibilidade): intervalo entre parada e liberação das falhas com necessidade de parada; intervalos sobrepostos são unidos (nunca somados duas vezes).', 'Tempo de reparo (MTTR): horas de trabalho técnico efetivo no reparo — não é o tempo total de indisponibilidade (que inclui espera por peças, diagnóstico etc.).']],
  ['Fórmulas', ['Disponibilidade (%) = MTBF / (MTBF + MTTR) × 100 (teórica).', 'Disponibilidade operacional (%) = (horas programadas − paradas) / horas programadas × 100.', 'MTBF = horas de operação / número de falhas. Sem falhas, não é calculável (não é zero).', 'MTTR = horas totais de reparo / número de falhas reparadas com tempo registrado.', 'Cumprimento (%) = preventivas concluídas / preventivas programadas × 100 (programadas = OS preventivas com início planejado no período; canceladas contam como não executadas).', 'Taxa de falhas λ = falhas / horas de operação (≈ 1/MTBF); exibida por hora e por 1000 h.', 'Confiabilidade R(t) = e^(−λt): pressupõe taxa de falhas constante; só apresentada como confiável com o mínimo de falhas e horas configurado.', 'Média da frota: calculada de forma agregada (somas de horas e falhas de todos os tornos), não pela média das médias.']],
  ['Regras de negócio', ['Equipamentos com histórico não podem ser excluídos; usa-se arquivamento.', 'OS: Aberta → Planejada → Em execução → Aguardando peças → Concluída → Encerrada; cancelamento exige justificativa; o histórico é preservado.', 'Estoque: a baixa ocorre ao iniciar a execução; cancelamento/remoção estorna; edições/reaberturas não duplicam movimentos (controle por quantidade já consumida).', 'Custos: lançados na OS ao encerrá-la (peças + mão de obra + terceiros + outros); passam a ser reais somente com a OS encerrada, antes disso são estimados; não há lançamento avulso de custos; valor de aquisição não é despesa de manutenção; custo efetivo da falha só conta se não houver OS vinculada.', 'Preços, códigos e compatibilidades não são inventados: campos não confirmados ficam “não informado”.', 'Todos os indicadores usam os mesmos serviços de cálculo na tela, no PDF e no Excel.']],
  ['Arquitetura e limites operacionais', ['Dados operacionais armazenados no PostgreSQL por API autenticada; a autorização é revalidada no servidor para cada gravação. As senhas são verificadas no servidor e hashes legados são atualizados para bcrypt após login.', 'Anexos limitados a 450 KB por arquivo. A exportação Excel não inclui gráficos nativos (os gráficos estão no PDF e na tela).', 'A hospedagem deve manter backups automáticos do PostgreSQL, HTTPS, variáveis de ambiente protegidas e monitoramento.']]
];
VIEWS.metodologia = () => setView(`<h1>Metodologia, fórmulas e regras de negócio</h1><div class="card prose">${METH.map(([t, ps]) => `<h3>${E(t)}</h3><ul>${ps.map(p => `<li>${E(p)}</li>`).join('')}</ul>`).join('')}</div>`);

boot();

</script>
</body>
</html>
